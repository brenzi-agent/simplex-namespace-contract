name: Fork CI

on:
  push:
    branches: ['ci/**']

jobs:
  upgradeable-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - id: pin
        run: echo "sha=$(git ls-tree HEAD ens-contracts | cut -f1 | cut -d' ' -f3)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: brenzi-agent/ens-contracts
          ref: ${{ steps.pin.outputs.sha }}
          path: ens-contracts

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ens-contracts/.nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm install --frozen-lockfile
        working-directory: ens-contracts

      - run: npx hardhat compile
        working-directory: ens-contracts

      - name: Script tests
        run: node --test scripts/governance-check.test.mjs scripts/prepare-upgrade.test.mjs

      - name: Journal checks
        run: |
          set -o pipefail
          node scripts/journal-check.mjs 2>&1 | tee journal-check.log
          ! grep -q 'Assertion failed' journal-check.log

      - name: Governance entries against mainnet
        env:
          MAINNET_RPC_URL: https://ethereum-rpc.publicnode.com
        run: node scripts/governance-check.mjs

      - name: Start a local Hardhat node
        working-directory: ens-contracts
        run: |
          nohup ./node_modules/.bin/hardhat --network hardhat node > "$GITHUB_WORKSPACE/hardhat-node.log" 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf -X POST -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$GITHUB_WORKSPACE/hardhat-node.log"
          exit 1

      - name: Deploy .simplex and .testing to the local node
        run: |
          SIMPLEX_TLD=simplex node scripts/deploy-local.mjs
          SIMPLEX_TLD=testing node scripts/deploy-local.mjs

      - name: Rename the v1 files, as the operator does at step 2
        run: |
          mv deployments.mainnet.simplex.json deployments.mainnet.simplex-v1.json
          mv deployments.mainnet.simplex.journal.jsonl deployments.mainnet.simplex-v1.journal.jsonl
          mv verification.mainnet.simplex.json verification.mainnet.simplex-v1.json

      - name: Rehearse runs 1 and 2 on a fork of mainnet
        env:
          MAINNET_RPC_URL: https://ethereum-rpc.publicnode.com
        run: node scripts/rehearse-mainnet.mjs
